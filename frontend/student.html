<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小石榴的学习</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #f5f5f0;
            --card: #ffffff;
            --border: #e8e4dc;
            --text: #2d2d2d;
            --text-secondary: #6b6b6b;
            --text-muted: #999999;
            --primary: #4a7c59;
            --primary-light: #e8f0eb;
            --accent: #d4a574;
            --accent-light: #faf3eb;
            --danger: #c0392b;
            --danger-light: #fceae8;
            --info: #5b8fa8;
            --info-light: #e8f2f7;
            --purple: #7c6da0;
            --purple-light: #f0edf5;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 14px;
            --radius-sm: 10px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 88px;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 登录页 ========== */
        .login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: linear-gradient(160deg, #e8f0eb 0%, #faf3eb 50%, #f5f0e8 100%);
        }

        .login-mascot {
            font-size: 72px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 36px 28px;
            width: 100%;
            max-width: 340px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .login-card h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .login-card .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .login-card .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .login-card label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: #fafafa;
            transition: all 0.2s;
        }

        .login-card input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .login-error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        /* ========== 主应用 ========== */
        .app-container { display: none; }
        .app-container.active { display: block; }

        /* 顶部问候 */
        .header {
            padding: 24px 20px 16px;
            background: white;
            border-bottom: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .greeting {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .date-display {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* KPI 卡片 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px 20px;
        }

        .kpi-card {
            background: white;
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .kpi-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .kpi-icon.green { background: var(--primary-light); }
        .kpi-icon.orange { background: var(--accent-light); }
        .kpi-icon.blue { background: var(--info-light); }
        .kpi-icon.purple { background: var(--purple-light); }

        .kpi-info .kpi-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }

        .kpi-info .kpi-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 区域标题 */
        .section {
            padding: 0 20px;
            margin-bottom: 16px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .section-action {
            font-size: 13px;
            color: var(--primary);
            cursor: pointer;
        }

        /* 任务卡片 */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: white;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            gap: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .task-item:active {
            transform: scale(0.98);
        }

        .task-item.completed {
            background: var(--primary-light);
            border-color: #b8d4c0;
        }

        .task-checkbox {
            width: 26px;
            height: 26px;
            border: 2.5px solid #d0d0d0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .task-item.completed .task-checkbox {
            background: var(--primary);
            border-color: var(--primary);
        }

        .task-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .task-name {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
        }

        .task-item.completed .task-name {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .task-status {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .task-status.done {
            background: var(--primary-light);
            color: var(--primary);
        }

        .task-status.pending {
            background: #f5f5f5;
            color: var(--text-muted);
        }

        /* 快捷操作 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 20px;
            margin-bottom: 16px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 8px;
            background: white;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn .action-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .action-btn .action-icon.green { background: var(--primary-light); }
        .action-btn .action-icon.orange { background: var(--accent-light); }
        .action-btn .action-icon.blue { background: var(--info-light); }
        .action-btn .action-icon.purple { background: var(--purple-light); }

        .action-btn .action-text {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* 留言卡片 */
        .message-card {
            margin: 0 20px 16px;
            background: linear-gradient(135deg, var(--accent-light), #fff);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid #f0e0d0;
        }

        .message-card .msg-from {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-card .msg-content {
            font-size: 15px;
            color: var(--text);
            line-height: 1.6;
        }

        .message-card .msg-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 12px;
            cursor: pointer;
            position: relative;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .nav-item .nav-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 20px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* 页面 */
        .page { display: none; }
        .page.active { display: block; }

        /* 提交表单 */
        .submit-form {
            padding: 16px 20px;
        }

        .form-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .form-card .form-group {
            margin-bottom: 16px;
        }

        .form-card .form-group:last-child {
            margin-bottom: 0;
        }

        .form-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-card select,
        .form-card input,
        .form-card textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: #fafafa;
            transition: all 0.2s;
        }

        .form-card textarea {
            height: 80px;
            resize: none;
            font-family: inherit;
        }

        .form-card select:focus,
        .form-card input:focus,
        .form-card textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* 进度页 */
        .progress-card {
            background: white;
            border-radius: var(--radius);
            padding: 16px;
            margin: 0 20px 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .progress-card .subject-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .progress-card .subject-icon {
            font-size: 20px;
        }

        .progress-card .subject-name {
            font-size: 15px;
            font-weight: 600;
            flex: 1;
        }

        .progress-card .subject-pct {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }

        .progress-bar {
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), #6ba37a);
            transition: width 0.5s ease;
        }

        .progress-card .stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 阅读页 */
        .book-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: white;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin: 0 20px 8px;
            gap: 12px;
        }

        .book-item .book-icon {
            font-size: 24px;
        }

        .book-item .book-info {
            flex: 1;
        }

        .book-item .book-title {
            font-size: 15px;
            font-weight: 600;
        }

        .book-item .book-pages {
            font-size: 12px;
            color: var(--text-muted);
        }

        .book-item .book-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 500;
        }

        /* 任务分组 */
        .task-group {
            background: white;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 8px;
        }

        .task-group-header {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: var(--primary-light);
            gap: 12px;
            border-bottom: 1px solid #d8e8dc;
        }

        .task-group-header .task-icon {
            font-size: 20px;
        }

        .task-group-header .task-name {
            flex: 1;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }

        .task-group-count {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            padding: 3px 10px;
            background: white;
            border-radius: 12px;
        }

        .task-group-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-group-body .task-item {
            margin: 0;
            box-shadow: none;
            border: 1px solid #f0f0f0;
            padding: 12px 14px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ========== 作业拍照提交 ========== */
        .btn-submit-photo {
            margin-left: 8px;
            padding: 5px 12px;
            font-size: 12px;
            border: 1.5px solid var(--primary);
            background: #fff;
            color: var(--primary);
            border-radius: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .btn-submit-photo:hover {
            background: var(--primary);
            color: #fff;
        }

        .sub-badge {
            margin-left: 8px;
            padding: 2px 8px;
            font-size: 11px;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 10px;
            white-space: nowrap;
        }

        .sub-badge.graded {
            background: #e6f9e9;
            color: #2e7d32;
            font-weight: 600;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: var(--radius);
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-shadow: var(--shadow-md);
        }

        .modal-box h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .modal-actions button {
            padding: 8px 18px;
            font-size: 13px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
        }

        .modal-actions button.secondary {
            background: #eee;
            color: #666;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .submit-preview img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div class="login-page" id="loginPage">
        <div class="login-mascot">🌸</div>
        <div class="login-card">
            <h1>小石榴的学习</h1>
            <p class="subtitle">加油！今天也要努力哦~</p>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn-login" onclick="doLogin()">开始学习</button>
            <p class="login-error" id="loginError">用户名或密码错误</p>
        </div>
    </div>

    <!-- 主应用 -->
    <div class="app-container" id="appContainer">
        <!-- 今日任务页 -->
        <div class="page active" id="page-today">
            <div class="header">
                <div class="header-top">
                    <div class="greeting" id="greeting">你好，小石榴！</div>
                    <div class="header-avatar">🌸</div>
                </div>
                <div class="date-display" id="dateDisplay"></div>
            </div>

            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon green">📊</div>
                    <div class="kpi-info">
                        <div class="kpi-value" id="kpiRate">--%</div>
                        <div class="kpi-label">今日完成</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon orange">🔥</div>
                    <div class="kpi-info">
                        <div class="kpi-value" id="kpiStreak">0天</div>
                        <div class="kpi-label">连续打卡</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon blue">✅</div>
                    <div class="kpi-info">
                        <div class="kpi-value" id="kpiWeekCheckins">0</div>
                        <div class="kpi-label">本周打卡</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon purple">📝</div>
                    <div class="kpi-info">
                        <div class="kpi-value" id="kpiMistakes">0</div>
                        <div class="kpi-label">本周错题</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <div class="section-title">📋 今日任务</div>
                    <div class="section-action" id="completionText">0/4 已完成</div>
                </div>
                <div class="task-list" id="taskList"></div>
            </div>

            <div class="section" style="margin-top:20px;">
                <div class="section-header">
                    <div class="section-title">💬 爸爸妈妈的话</div>
                </div>
            </div>
            <div class="message-card" id="parentMessage">
                <div class="msg-from">❤️ 来自爸爸</div>
                <div class="msg-content">今天也要加油哦！</div>
                <div class="msg-time"></div>
            </div>
        </div>

        <!-- 提交页 -->
        <div class="page" id="page-submit">
            <div class="header">
                <div class="header-top">
                    <div class="greeting">📸 提交作业</div>
                    <div class="header-avatar">📝</div>
                </div>
            </div>

            <div class="submit-form">
                <div class="form-card">
                    <div class="form-group">
                        <label>类型</label>
                        <select id="submitType">
                            <option value="mistake">📝 错题</option>
                            <option value="homework">📄 作业</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>学科</label>
                        <select id="submitSubject">
                            <option value="语文">📖 语文</option>
                            <option value="数学">🔢 数学</option>
                            <option value="英语">🔤 英语</option>
                            <option value="OD">📗 OD</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>题目/内容</label>
                        <textarea id="submitContent" placeholder="简单描述一下..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>拍照（可选）</label>
                        <input type="file" id="submitImage" accept="image/*" capture="camera">
                    </div>
                </div>
                <button class="btn-submit" onclick="submitWork()">提 交</button>
            </div>
        </div>

        <!-- 阅读页 -->
        <div class="page" id="page-reading">
            <div class="header">
                <div class="header-top">
                    <div class="greeting">📖 阅读记录</div>
                    <div class="header-avatar">📚</div>
                </div>
            </div>

            <div class="submit-form" style="padding-bottom:8px;">
                <div class="form-card">
                    <div class="form-group">
                        <label>书名</label>
                        <input type="text" id="bookTitle" placeholder="今天读了什么书？">
                    </div>
                    <div class="form-group">
                        <label>读了几页</label>
                        <input type="number" id="bookPages" placeholder="页数" min="1">
                    </div>
                </div>
                <button class="btn-submit" onclick="submitReading()">记 录</button>
            </div>

            <div class="section" style="margin-top:20px;">
                <div class="section-header">
                    <div class="section-title">📚 我的书单</div>
                </div>
            </div>
            <div id="bookList"></div>
        </div>

        <!-- 进度页 -->
        <div class="page" id="page-progress">
            <div class="header">
                <div class="header-top">
                    <div class="greeting">📊 我的进度</div>
                    <div class="header-avatar">📈</div>
                </div>
            </div>

            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon green">✅</div>
                    <div class="kpi-info">
                        <div class="kpi-value" id="totalCheckins">0</div>
                        <div class="kpi-label">本周打卡</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon blue">📝</div>
                    <div class="kpi-info">
                        <div class="kpi-value" id="totalMistakes">0</div>
                        <div class="kpi-label">本周错题</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <div class="section-title">各科进度</div>
                </div>
            </div>
            <div id="subjectProgress"></div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active" data-page="today" onclick="switchPage('today')">
                <span class="nav-icon">📋</span>
                <span class="nav-label">今日</span>
            </div>
            <div class="nav-item" data-page="submit" onclick="switchPage('submit')">
                <span class="nav-icon">📸</span>
                <span class="nav-label">提交</span>
            </div>
            <div class="nav-item" data-page="reading" onclick="switchPage('reading')">
                <span class="nav-icon">📖</span>
                <span class="nav-label">阅读</span>
            </div>
            <div class="nav-item" data-page="progress" onclick="switchPage('progress')">
                <span class="nav-icon">📊</span>
                <span class="nav-label">进度</span>
            </div>
            <div class="nav-item" onclick="doLogout()">
                <span class="nav-icon">🚪</span>
                <span class="nav-label">退出</span>
            </div>
        </div>
    </div>

    <!-- 作业提交模态框 -->
    <div class="modal-overlay" id="submitModal">
        <div class="modal-box">
            <h3 id="submitModalTitle">📷 提交作业</h3>
            <div class="upload-area" onclick="document.getElementById('submitFileInput').click()">
                <div style="font-size:28px;">📷</div>
                <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">点击拍照 / 选择照片上传</div>
                <input type="file" id="submitFileInput" accept="image/*" capture="environment" style="display:none">
            </div>
            <div class="submit-preview" id="submitPreview"></div>
            <div id="submitResult" style="display:none;"></div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeSubmitModal()">关闭</button>
                <button id="submitBtn" onclick="uploadSubmission()">提交作业</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/xuexi/api';
        let token = localStorage.getItem('xuexi_student_token');
        let currentUser = JSON.parse(localStorage.getItem('xuexi_student_user') || 'null');

        if (token && currentUser && currentUser.role === 'student') {
            showApp();
        } else {
            localStorage.removeItem('xuexi_student_token');
            localStorage.removeItem('xuexi_student_user');
        }

        async function doLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) { document.getElementById('loginError').style.display = 'block'; return; }
                const data = await res.json();
                if (data.user.role !== 'student') {
                    document.getElementById('loginError').textContent = '请使用学生账号登录';
                    document.getElementById('loginError').style.display = 'block';
                    return;
                }
                token = data.token;
                currentUser = data.user;
                localStorage.setItem('xuexi_student_token', token);
                localStorage.setItem('xuexi_student_user', JSON.stringify(currentUser));
                showApp();
            } catch (e) {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function showApp() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
            document.getElementById('greeting').textContent = `你好，${currentUser.display_name}！`;
            const now = new Date();
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
            loadTodayTasks();
            loadMessages();
        }

        function doLogout() {
            localStorage.removeItem('xuexi_student_token');
            localStorage.removeItem('xuexi_student_user');
            location.reload();
        }

        // ============ 作业拍照提交 ============
        let submitTaskId = null;

        function openSubmitModal(taskId, taskName) {
            submitTaskId = taskId;
            document.getElementById('submitModalTitle').textContent = `📷 提交作业：${taskName}`;
            document.getElementById('submitPreview').innerHTML = '';
            document.getElementById('submitResult').style.display = 'none';
            document.getElementById('submitResult').innerHTML = '';
            document.getElementById('submitFileInput').value = '';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').textContent = '提交作业';
            document.getElementById('submitModal').classList.add('active');
        }

        function closeSubmitModal() {
            document.getElementById('submitModal').classList.remove('active');
        }

        document.getElementById('submitFileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('submitPreview').innerHTML = `<img src="${ev.target.result}" alt="作业预览">`;
            };
            reader.readAsDataURL(file);
        });

        async function uploadSubmission() {
            const fileInput = document.getElementById('submitFileInput');
            if (!fileInput.files[0]) { alert('请先选择照片'); return; }
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '提交中...';
            const fd = new FormData();
            fd.append('image', fileInput.files[0]);
            fd.append('task_id', submitTaskId);
            fd.append('date', new Date().toISOString().split('T')[0]);
            try {
                const res = await fetch(`${API_BASE}/submissions`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: fd
                });
                const sub = await res.json();
                showSubmitResult(sub);
                loadTodayTasks(); // 刷新今日任务显示已提交状态
            } catch (e) {
                alert('提交失败');
                console.error(e);
            }
            btn.disabled = false;
            btn.textContent = '提交作业';
        }

        function showSubmitResult(sub) {
            const box = document.getElementById('submitResult');
            box.style.display = 'block';
            const ai = sub.ai_result;
            if (ai && ai.status === 'graded') {
                let html = `<div style="margin-top:12px;padding:12px;background:#f6fff6;border:1px solid #d4edda;border-radius:8px;">
                    <div style="font-size:15px;font-weight:700;color:#2e7d32;">📊 AI 批改结果</div>
                    <div style="font-size:13px;margin-top:6px;color:#555;">共 ${ai.total || 0} 题 · 答对 ${ai.correct || 0} 题 · 正确率 ${Math.round((ai.accuracy || 0) * 100)}%</div>`;
                (ai.questions || []).forEach(q => {
                    html += `<div style="margin-top:6px;font-size:13px;${q.correct ? 'color:#2e7d32;' : 'color:#c0392b;'}">
                        ${q.correct ? '✅' : '❌'} ${q.q || ''} = ${q.student_answer || '未作答'}
                        ${q.correct ? '' : `<span style="color:#888;">（正确答案 ${q.correct_answer || '?'}）</span>`}
                        ${q.note ? `<span style="color:#e67e22;">· ${q.note}</span>` : ''}
                    </div>`;
                });
                html += '</div>';
                box.innerHTML = html;
            } else if (ai && ai.status === 'failed') {
                box.innerHTML = `<div style="margin-top:12px;padding:12px;background:#fff3f3;border:1px solid #f5c6cb;border-radius:8px;font-size:13px;color:#c0392b;">⚠️ AI 批改失败：${ai.error || '未知错误'}。照片已保存，可重新提交。</div>`;
            } else {
                box.innerHTML = `<div style="margin-top:12px;padding:12px;background:#f0f7ff;border:1px solid #bee5eb;border-radius:8px;font-size:13px;color:#0c5460;">📷 作业已提交，棒棒哒！</div>`;
            }
        }

        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
            if (page === 'progress') loadProgress();
            if (page === 'reading') loadBooks();
        }

        async function loadTodayTasks() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const [taskRes, subRes] = await Promise.all([
                    fetch(`${API_BASE}/checkins/today`, { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch(`${API_BASE}/submissions?date=${today}`, { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                const data = await taskRes.json();
                const submissions = await subRes.json();
                const container = document.getElementById('taskList');

                // 按任务 id 索引当天提交记录
                const subMap = {};
                (submissions || []).forEach(s => { subMap[s.task_id] = s; });

                const subBadge = (sub) => {
                    if (!sub) return '';
                    const ai = sub.ai_result;
                    if (ai && ai.status === 'graded') {
                        return `<span class="sub-badge graded" title="AI批改：${Math.round(ai.accuracy * 100)}%正确">📷 ${Math.round(ai.accuracy * 100)}分</span>`;
                    }
                    return `<span class="sub-badge">📷 已提交</span>`;
                };
                const photoBtn = (task, label) => {
                    if (!task.needs_photo) return '';
                    return `<button class="btn-submit-photo" onclick="event.stopPropagation();openSubmitModal(${task.id}, '${label.replace(/'/g, "\\'")}')">📷 提交</button>`;
                };

                // 渲染任务（带子任务的显示为分组）
                let html = '';
                data.tasks.forEach(task => {
                    if (task.sub_tasks && task.sub_tasks.length > 0) {
                        // 大类任务（如OD学习） - 显示为分组标题
                        const subCompleted = task.sub_tasks.filter(s => s.is_completed).length;
                        const subTotal = task.sub_tasks.length;
                        html += `
                            <div class="task-group">
                                <div class="task-group-header">
                                    <span class="task-icon">${task.icon}</span>
                                    <span class="task-name">${task.name}</span>
                                    <span class="task-group-count">${subCompleted}/${subTotal}</span>
                                </div>
                                <div class="task-group-body">
                        `;
                        task.sub_tasks.forEach(sub => {
                            html += `
                                <div class="task-item ${sub.is_completed ? 'completed' : ''}" onclick="toggleTask(${sub.id}, ${sub.is_completed ? 0 : 1})">
                                    <div class="task-checkbox">${sub.is_completed ? '✓' : ''}</div>
                                    <span class="task-icon">${sub.icon}</span>
                                    <span class="task-name">${sub.name}</span>
                                    ${subBadge(subMap[sub.id])}
                                    ${photoBtn(sub, sub.name)}
                                    <span class="task-status ${sub.is_completed ? 'done' : 'pending'}">${sub.is_completed ? '已完成' : '待完成'}</span>
                                </div>
                            `;
                        });
                        html += `</div></div>`;
                    } else {
                        // 普通任务
                        html += `
                            <div class="task-item ${task.is_completed ? 'completed' : ''}" onclick="toggleTask(${task.id}, ${task.is_completed ? 0 : 1})">
                                <div class="task-checkbox">${task.is_completed ? '✓' : ''}</div>
                                <span class="task-icon">${task.icon}</span>
                                <span class="task-name">${task.name}</span>
                                ${subBadge(subMap[task.id])}
                                ${photoBtn(task, task.name)}
                                <span class="task-status ${task.is_completed ? 'done' : 'pending'}">${task.is_completed ? '已完成' : '待完成'}</span>
                            </div>
                        `;
                    }
                });
                container.innerHTML = html;

                // 更新完成率
                let completed = 0, total = 0;
                data.tasks.forEach(task => {
                    if (task.sub_tasks && task.sub_tasks.length > 0) {
                        task.sub_tasks.forEach(s => { total++; if (s.is_completed) completed++; });
                    } else {
                        total++;
                        if (task.is_completed) completed++;
                    }
                });
                const rate = total ? Math.round((completed / total) * 100) : 0;
                document.getElementById('kpiRate').textContent = rate + '%';
                document.getElementById('completionText').textContent = `${completed}/${total} 已完成`;
            } catch (e) { console.error(e); }

            try {
                const res = await fetch(`${API_BASE}/stats/dashboard`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                document.getElementById('kpiStreak').textContent = data.streak + '天';
                document.getElementById('kpiMistakes').textContent = data.week_mistakes;
            } catch (e) { console.error(e); }

            try {
                const res = await fetch(`${API_BASE}/checkins/week`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const total = data.stats.reduce((sum, d) => sum + d.completed, 0);
                document.getElementById('kpiWeekCheckins').textContent = total;
            } catch (e) { console.error(e); }
        }

        async function toggleTask(taskId, completed) {
            const today = new Date().toISOString().split('T')[0];
            try {
                await fetch(`${API_BASE}/checkins`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ task_id: taskId, date: today, is_completed: completed })
                });
                loadTodayTasks();
            } catch (e) { console.error(e); }
        }

        async function loadMessages() {
            try {
                const res = await fetch(`${API_BASE}/messages`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const container = document.getElementById('parentMessage');
                if (data.length > 0) {
                    const msg = data[0];
                    container.innerHTML = `
                        <div class="msg-from">❤️ 来自爸爸</div>
                        <div class="msg-content">${msg.content}</div>
                        <div class="msg-time">${new Date(msg.created_at).toLocaleString('zh-CN')}</div>
                    `;
                }
            } catch (e) { console.error(e); }
        }

        async function submitWork() {
            const type = document.getElementById('submitType').value;
            const subject = document.getElementById('submitSubject').value;
            const content = document.getElementById('submitContent').value;
            const imageFile = document.getElementById('submitImage').files[0];
            if (!content && !imageFile) { alert('请填写内容或拍照'); return; }
            const formData = new FormData();
            formData.append('subject', subject);
            formData.append('description', content);
            formData.append('topic', type === 'mistake' ? '错题' : '作业');
            if (imageFile) formData.append('image', imageFile);
            try {
                await fetch(`${API_BASE}/mistakes`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                alert('提交成功！');
                document.getElementById('submitContent').value = '';
                document.getElementById('submitImage').value = '';
            } catch (e) { alert('提交失败'); }
        }

        async function submitReading() {
            const title = document.getElementById('bookTitle').value;
            const pages = parseInt(document.getElementById('bookPages').value);
            if (!title) { alert('请填写书名'); return; }
            try {
                await fetch(`${API_BASE}/books`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ title, status: 'reading', total_pages: pages || 0, current_page: pages || 0 })
                });
                alert('记录成功！');
                document.getElementById('bookTitle').value = '';
                document.getElementById('bookPages').value = '';
                loadBooks();
            } catch (e) { alert('记录失败'); }
        }

        async function loadBooks() {
            try {
                const res = await fetch(`${API_BASE}/books`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const container = document.getElementById('bookList');
                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div><p>还没有阅读记录</p></div>';
                } else {
                    container.innerHTML = data.map(book => `
                        <div class="book-item">
                            <span class="book-icon">📚</span>
                            <div class="book-info">
                                <div class="book-title">${book.title}</div>
                                <div class="book-pages">${book.current_page} 页</div>
                            </div>
                            <span class="book-status">${book.status === 'reading' ? '在读' : book.status === 'finished' ? '读完' : '想读'}</span>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        async function loadProgress() {
            try {
                const res = await fetch(`${API_BASE}/checkins/week`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const total = data.stats.reduce((sum, d) => sum + d.completed, 0);
                document.getElementById('totalCheckins').textContent = total;
            } catch (e) { console.error(e); }
            try {
                const res = await fetch(`${API_BASE}/mistakes/stats`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const total = data.reduce((sum, s) => sum + s.total, 0);
                document.getElementById('totalMistakes').textContent = total;
            } catch (e) { console.error(e); }
            try {
                const res = await fetch(`${API_BASE}/stats/subjects`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const icons = { '语文': '📖', '数学': '🔢', '英语': '🔤', 'OD': '📗' };
                const container = document.getElementById('subjectProgress');
                container.innerHTML = data.map(s => {
                    const pct = s.total_checkins ? Math.round((s.completed / s.total_checkins) * 100) : 0;
                    return `
                        <div class="progress-card">
                            <div class="subject-row">
                                <span class="subject-icon">${icons[s.subject] || '📝'}</span>
                                <span class="subject-name">${s.subject}</span>
                                <span class="subject-pct">${pct}%</span>
                            </div>
                            <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
                            <div class="stats-row"><span>完成 ${s.completed} 次</span><span>共 ${s.total_checkins} 次</span></div>
                        </div>
                    `;
                }).join('');
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
