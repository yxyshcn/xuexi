/* 纸娃娃换装系统样式 */
.dressup-container {
    padding: 20px;
}

.character-display {
    position: relative;
    width: 300px;
    height: 400px;
    margin: 0 auto 30px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.character-base {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgZmlsbD0iI2YwZjBmMCIvPjxjaXJjbGUgY3g9IjE1MCIgY3k9IjEwMCIgcj0iNDAiIGZpbGw9IiNmZmQ3ZDciLz48cmVjdCB4PSIxMzAiIHk9IjE0MCIgd2lkdGg9IjQwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZDdkNyIvPjxyZWN0IHg9IjEwMCIgeT0iMjQwIiB3aWR0aD0iNDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjZmZkN2Q3Ii8+PHJlY3QgeD0iMTYwIiB5PSIyNDAiIHdpZHRoPSI0MCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiNmZmQ3ZDciLz48L3N2Zz4=');
}

.character-outfit {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.outfit-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}

.outfit-categories {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    overflow-x: auto;
    padding-bottom: 10px;
}

.category-btn {
    padding: 10px 20px;
    border: none;
    background: #f0f0f0;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.3s;
    font-size: 14px;
}

.category-btn.active {
    background: #667eea;
    color: white;
}

.outfit-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 20px;
}

.outfit-item {
    background: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.3s;
}

.outfit-item:hover {
    transform: translateY(-5px);
}

.outfit-item.owned {
    border: 3px solid #4CAF50;
}

.outfit-item.equipped {
    border: 3px solid #667eea;
    background: #f0f4ff;
}

.outfit-preview {
    width: 100%;
    height: 150px;
    background: #f9f9f9;
    border-radius: 10px;
    margin-bottom: 10px;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}

.outfit-name {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 5px;
}

.outfit-category {
    font-size: 12px;
    color: #666;
    margin-bottom: 10px;
}

.outfit-price {
    font-size: 14px;
    color: #ff6b6b;
    font-weight: bold;
}

.outfit-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.btn-buy, .btn-equip, .btn-unequip {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s;
}

.btn-buy {
    background: #ff6b6b;
    color: white;
}

.btn-buy:hover {
    background: #ff5252;
}

.btn-equip {
    background: #4CAF50;
    color: white;
}

.btn-equip:hover {
    background: #45a049;
}

.btn-unequip {
    background: #9e9e9e;
    color: white;
}

.btn-unequip:hover {
    background: #757575;
}

.btn-buy:disabled, .btn-equip:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            /* 动森色板 - Animal Crossing Palette */
            --bg: #f8f8f0;
            --card: rgb(247, 243, 223);
            --border: #e8e2d6;
            --text: #725d42;
            --text-secondary: #8a7b66;
            --text-muted: #9f927d;
            --primary: #19c8b9;
            --primary-hover: #3dd4c6;
            --primary-active: #50b9ab;
            --primary-light: #e6f9f6;
            --accent: #f7cd67;
            --accent-light: #fdf6e3;
            --danger: #fc736d;
            --danger-light: #fde8e7;
            --info: #889df0;
            --info-light: #e8ecfc;
            --purple: #b77dee;
            --purple-light: #f3eafc;
            --shadow: 0 2px 4px 0 rgba(61, 52, 40, 0.06);
            --shadow-md: 0 3px 10px 0 rgba(61, 52, 40, 0.10);
            --radius: 20px;
            --radius-sm: 16px;
            --btn-3d-shadow: #bdaea0;
            --focus-yellow: #ffcc00;
        }

        body {
            font-family: Nunito, 'Noto Sans SC', 'Zen Maru Gothic', 'HarmonyOS Sans SC', -apple-system, 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 88px;
            -webkit-font-smoothing: antialiased;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        /* ========== 登录页 ========== */
        .login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: linear-gradient(160deg, #e6f9f6 0%, #fdf6e3 50%, #f8f8f0 100%);
        }

        .login-mascot {
            font-size: 72px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .login-card {
            background: rgb(247, 243, 223);
            border-radius: 24px;
            padding: 36px 28px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 8px 24px rgba(114, 93, 66, 0.15);
            border: 2px solid var(--border);
            text-align: center;
        }

        .login-card h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .login-card .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .login-card .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .login-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 18px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            background: #fffbe7;
            color: var(--text);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-card input:focus {
            outline: 2px solid var(--focus-yellow);
            outline-offset: 2px;
            background: #fff;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 0 0 var(--btn-3d-shadow);
            letter-spacing: 0.02em;
        }

        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 0 0 var(--btn-3d-shadow);
        }

        .btn-login:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 0 var(--btn-3d-shadow);
        }

        .login-error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        /* ========== 主应用 ========== */
        .app-container { display: none; }
        .app-container.active { display: block; }

        /* 顶部问候 */
        .header {
            padding: 24px 20px 16px;
            background: rgb(247, 243, 223);
            border-bottom: 2px solid var(--border);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .greeting {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .header-avatar {
            width: 60px;
            height: 60px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid var(--border);
            transition: transform 0.2s;
        }

        .header-avatar:hover {
            transform: scale(1.1);
        }

        .header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 头像库页面 */
        .avatar-gallery {
            padding: 16px 20px;
        }

        .avatar-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .avatar-tab {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: #f0ece2;
            color: var(--text-secondary);
            border: none;
            transition: all 0.2s;
        }

        .avatar-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 3px 0 0 var(--btn-3d-shadow);
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .avatar-item {
            background: rgb(247, 243, 223);
            border-radius: 16px;
            border: 2px solid var(--border);
            padding: 12px;
            text-align: center;
            position: relative;
            transition: all 0.2s;
        }

        .avatar-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .avatar-item .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 8px;
            overflow: hidden;
            border: 2px solid var(--border);
            background: #f0ece2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .avatar-item .avatar-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-item .avatar-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .avatar-item .avatar-price {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
        }

        .avatar-item .avatar-btn {
            margin-top: 6px;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .avatar-btn.buy {
            background: var(--accent);
            color: #725d42;
            box-shadow: 0 2px 0 0 var(--btn-3d-shadow);
        }

        .avatar-btn.use {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 0 0 var(--btn-3d-shadow);
        }

        .avatar-btn.using {
            background: var(--primary-light);
            color: var(--primary);
            cursor: default;
            box-shadow: none;
        }

        .avatar-btn.locked {
            background: #f0ece2;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .avatar-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 14px;
        }

        .date-display {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* KPI 卡片 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px 20px;
        }

        .kpi-card {
            background: rgb(247, 243, 223);
            border-radius: 20px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .kpi-card:hover {
            transform: translateY(-2px);
        }

        .kpi-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .kpi-icon.green { background: var(--primary-light); }
        .kpi-icon.orange { background: var(--accent-light); }
        .kpi-icon.blue { background: var(--info-light); }
        .kpi-icon.purple { background: var(--purple-light); }

        .kpi-info .kpi-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
        }

        .kpi-info .kpi-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 区域标题 */
        .section {
            padding: 0 20px;
            margin-bottom: 16px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .section-action {
            font-size: 13px;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        /* 任务卡片 */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: rgb(247, 243, 223);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .task-item:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .task-item:active {
            transform: scale(0.98);
        }

        .task-item.completed {
            background: var(--primary-light);
            border-color: var(--primary-active);
        }

        .task-checkbox {
            width: 26px;
            height: 26px;
            border: 2.5px solid #c4b89e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            transition: all 0.15s;
            flex-shrink: 0;
            background: var(--card);
        }

        .task-checkbox:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .task-item.completed .task-checkbox {
            background: var(--primary);
            border-color: var(--primary-active);
        }

        .task-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .task-name {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
        }

        .task-item.completed .task-name {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .task-status {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 50px;
            font-weight: 600;
        }

        .task-status.done {
            background: var(--primary-light);
            color: var(--primary);
        }

        .task-status.pending {
            background: #f0ece2;
            color: var(--text-muted);
        }

        /* 快捷操作 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 20px;
            margin-bottom: 16px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 8px;
            background: rgb(247, 243, 223);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn .action-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .action-btn .action-icon.green { background: var(--primary-light); }
        .action-btn .action-icon.orange { background: var(--accent-light); }
        .action-btn .action-icon.blue { background: var(--info-light); }
        .action-btn .action-icon.purple { background: var(--purple-light); }

        .action-btn .action-text {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* 留言卡片 */
        .message-card {
            margin: 0 20px 16px;
            background: linear-gradient(135deg, var(--accent-light), rgb(247, 243, 223));
            border-radius: 20px;
            padding: 16px;
            border: 2px solid #f0e0c0;
        }

        .message-card .msg-from {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-card .msg-content {
            font-size: 15px;
            color: var(--text);
            line-height: 1.6;
            font-weight: 500;
        }

        .message-card .msg-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgb(247, 243, 223);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            border-top: 2px solid var(--border);
            box-shadow: 0 -2px 8px rgba(114, 93, 66, 0.08);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 12px;
            cursor: pointer;
            position: relative;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .nav-item .nav-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 700;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 20px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* 积分页面样式 */
        .points-balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: var(--radius);
            padding: 24px;
            margin: 16px 20px;
            color: white;
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .points-balance-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .points-balance-value {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
        }

        .points-balance-sub {
            font-size: 13px;
            opacity: 0.8;
        }

        .reward-card {
            background: white;
            border-radius: var(--radius);
            padding: 16px;
            margin: 12px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .reward-icon {
            font-size: 36px;
            flex-shrink: 0;
        }

        .reward-info {
            flex: 1;
            min-width: 0;
        }

        .reward-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .reward-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .reward-cost {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .reward-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 3px 0 0 var(--btn-3d-shadow);
            white-space: nowrap;
        }

        .reward-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 0 0 var(--btn-3d-shadow);
        }

    <script>

// 纸娃娃换装系统
let allOutfits = [];
let ownedOutfits = [];
let currentOutfit = {};
let currentCategory = 'all';

// 加载换装页面
async function loadDressupPage() {
    await Promise.all([
        loadAllOutfits(),
        loadOwnedOutfits(),
        loadCurrentOutfit()
    ]);
    renderOutfitList();
    renderCharacter();
}

// 加载所有服装
async function loadAllOutfits() {
    const res = await fetch('/xuexi/api/outfits', {
        headers: { 'Authorization': 'Bearer ' + token }
    });
    allOutfits = await res.json();
}

// 加载已拥有的服装
async function loadOwnedOutfits() {
    const res = await fetch('/xuexi/api/outfits/mine', {
        headers: { 'Authorization': 'Bearer ' + token }
    });
    ownedOutfits = await res.json();
}

// 加载当前装扮
async function loadCurrentOutfit() {
    const res = await fetch('/xuexi/api/students/outfit', {
        headers: { 'Authorization': 'Bearer ' + token }
    });
    currentOutfit = await res.json();
}

// 渲染服装列表
function renderOutfitList() {
    const list = document.getElementById('outfitList');
    let filtered = currentCategory === 'all' 
        ? allOutfits 
        : allOutfits.filter(o => o.category === currentCategory);
    
    list.innerHTML = filtered.map(outfit => {
        const owned = ownedOutfits.some(o => o.id === outfit.id);
        const equipped = currentOutfit[outfit.category] === outfit.id;
        
        let actions = '';
        if (!owned) {
            actions = '<button class="btn-buy" onclick="buyOutfit(' + outfit.id + ')">购买 ' + outfit.price + '金币</button>';
        } else if (equipped) {
            actions = '<button class="btn-unequip" onclick="unequipOutfit(\'' + outfit.category + '\')">卸下</button>';
        } else {
            actions = '<button class="btn-equip" onclick="equipOutfit(' + outfit.id + ', \'' + outfit.category + '\')">装备</button>';
        }
        
        return '<div class="outfit-item ' + (owned ? 'owned' : '') + ' ' + (equipped ? 'equipped' : '') + '">' +
            '<div class="outfit-preview" style="background-color: ' + getOutfitColor(outfit.category) + '; background-image: url(' + outfit.image_url + ');"></div>' +
            '<div class="outfit-name">' + outfit.name + '</div>' +
            '<div class="outfit-category">' + getCategoryName(outfit.category) + '</div>' +

    let layers = '';

    const equippedItems = Object.entries(currentOutfit)
        .filter(([category, id]) => id !== null)
        .map(([category, id]) => {
            const outfit = allOutfits.find(o => o.id === id);
            return outfit;
        })
        .filter(o => o)
        .sort((a, b) => a.z_index - b.z_index);

        async function loadTodayTasks() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const [taskRes, subRes] = await Promise.all([
                    fetch(`${API_BASE}/checkins/today`, { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch(`${API_BASE}/submissions?date=${today}`, { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                const data = await taskRes.json();
                const submissions = await subRes.json();
                const container = document.getElementById('taskList');

                // 按任务 id 索引当天提交记录
                const subMap = {};
                (submissions || []).forEach(s => { subMap[s.task_id] = s; });

                const subBadge = (sub) => {
                    if (!sub) return '';
                    const ai = sub.ai_result;
                    if (ai && ai.status === 'graded') {
                        return `<span class="sub-badge graded" title="AI批改：${Math.round(ai.accuracy * 100)}%正确">📷 ${Math.round(ai.accuracy * 100)}分</span>`;
                    }
                    return `<span class="sub-badge">📷 已提交</span>`;
                };
                const photoBtn = (task, label) => {
                    if (!task.needs_photo) return '';
                    return `<button class="btn-submit-photo" onclick="event.stopPropagation();openSubmitModal(${task.id}, '${label.replace(/'/g, "\\'")}')">📷 提交</button>`;
                };

                // 渲染任务（带子任务的显示为分组）
                let html = '';
                data.tasks.forEach(task => {
                    if (task.sub_tasks && task.sub_tasks.length > 0) {
                        // 大类任务（如OD学习） - 显示为分组标题
                        const subCompleted = task.sub_tasks.filter(s => s.is_completed).length;
                        const subTotal = task.sub_tasks.length;
                        html += `
                            <div class="task-group">
                                <div class="task-group-header">
                                    <span class="task-icon">${task.icon}</span>
                                    <span class="task-name">${task.name}</span>
                                    <span class="task-group-count">${subCompleted}/${subTotal}</span>
                                </div>
                                <div class="task-group-body">
                        `;
                        task.sub_tasks.forEach(sub => {
                            html += `
                                <div class="task-item ${sub.is_completed ? 'completed' : ''}" onclick="toggleTask(${sub.id}, ${sub.is_completed ? 0 : 1})">
                                    <div class="task-checkbox">${sub.is_completed ? '✓' : ''}</div>
                                    <span class="task-icon">${sub.icon}</span>
                                    <span class="task-name">${sub.name}</span>
                                    ${subBadge(subMap[sub.id])}
                                    ${photoBtn(sub, sub.name)}
                                    <span class="task-status ${sub.is_completed ? 'done' : 'pending'}">${sub.is_completed ? '已完成' : '待完成'}</span>
                                </div>
                            `;
                        });
                        html += `</div></div>`;
                    } else {
                        // 普通任务
                        html += `
                            <div class="task-item ${task.is_completed ? 'completed' : ''}" onclick="toggleTask(${task.id}, ${task.is_completed ? 0 : 1})">
                                <div class="task-checkbox">${task.is_completed ? '✓' : ''}</div>
                                <span class="task-icon">${task.icon}</span>
                                <span class="task-name">${task.name}</span>
                                ${subBadge(subMap[task.id])}
                                ${photoBtn(task, task.name)}
                                <span class="task-status ${task.is_completed ? 'done' : 'pending'}">${task.is_completed ? '已完成' : '待完成'}</span>
                            </div>
                        `;
                    }
                });
                container.innerHTML = html;

                // 更新完成率
                let completed = 0, total = 0;
                data.tasks.forEach(task => {
                    if (task.sub_tasks && task.sub_tasks.length > 0) {
                        task.sub_tasks.forEach(s => { total++; if (s.is_completed) completed++; });
                    } else {
                        total++;
                        if (task.is_completed) completed++;
                    }
                });
                const rate = total ? Math.round((completed / total) * 100) : 0;
                document.getElementById('kpiRate').textContent = rate + '%';
                document.getElementById('completionText').textContent = `${completed}/${total} 已完成`;
            } catch (e) { console.error(e); }

            try {
                const res = await fetch(`${API_BASE}/stats/dashboard`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                document.getElementById('kpiStreak').textContent = data.streak + '天';
            } catch (e) { console.error(e); }

            try {
                const res = await fetch(`${API_BASE}/checkins/week`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const total = data.stats.reduce((sum, d) => sum + d.completed, 0);
                document.getElementById('kpiWeekCheckins').textContent = total;
            } catch (e) { console.error(e); }
        }

                const container = document.getElementById('redemptionHistory');
                if (redemptions.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>还没有兑换过奖励</p></div>';
                } else {
                    container.innerHTML = redemptions.map(red => `
                        <div class="redemption-item">
                            <div class="redemption-info">
                                <div class="redemption-name">🎁 ${red.reward_name}</div>
                                <div class="redemption-time">${new Date(red.redeemed_at).toLocaleString('zh-CN')}</div>
                            </div>
                            <div class="redemption-cost">-${red.cost} 分</div>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        async function redeemReward(rewardId, rewardName, cost) {
            if (!confirm(`确定要兑换「${rewardName}」吗？需要 ${cost} 积分`)) return;

            try {
                const res = await fetch(`${API_BASE}/points/redeem`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ reward_id: rewardId })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    alert(`🎉 兑换成功！\n\n奖励：${rewardName}\n消耗：${cost} 分\n剩余积分：${data.balance} 分`);
                    loadPointsPage(); // 刷新页面
                } else {
                    alert(data.error || '兑换失败');
                }
            } catch (e) {
                console.error(e);
                alert('兑换失败，请稍后重试');
            }
        }

        // ============ 头像功能 ============
        let allAvatars = [];
        let ownedAvatars = [];
        let currentAvatarId = null;
        let avatarTab = 'all';

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE}/stats/dashboard`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                document.getElementById('kpiStreak').textContent = data.streak + '天';
                document.getElementById('kpiWeekCheckins').textContent = data.week_checkins;
                document.getElementById('kpiPoints').textContent = data.points;
                
                // 加载当前头像
                loadCurrentAvatar();
            } catch (e) {
                console.error(e);
            }
        }

        async function loadCurrentAvatar() {
            try {
                const res = await fetch(`${API_BASE}/students/avatar`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const avatar = await res.json();
                
                if (avatar && avatar.image_url) {
                    document.getElementById("currentAvatar").src = avatar.image_url;
                    const ca2 = document.getElementById("currentAvatar2");
                    if (ca2) { ca2.src = avatar.image_url; ca2.style.display = "block"; }
                    document.getElementById('currentAvatar').style.display = 'block';
                    document.getElementById('defaultAvatarIcon').style.display = 'none';
const dai2 = document.getElementById('defaultAvatarIcon2');                    if (dai2) { dai2.style.display = 'none'; }
                    currentAvatarId = avatar.id;
                }
            } catch (e) {
                console.error(e);
            }
        }

async function loadAvatarGallery() {
            try {
                // 先确保加载了当前头像
                await loadCurrentAvatar();
                // 加载所有头像和已拥有的头像
                const [allRes, ownedRes] = await Promise.all([
                    fetch(`${API_BASE}/avatars`),
                    fetch(`${API_BASE}/avatars/mine`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);
                allAvatars = await allRes.json();
                ownedAvatars = await ownedRes.json();
                renderAvatarGrid();
            } catch (e) {
                console.error(e);
            }
        }

        function switchAvatarTab(tab) {
            avatarTab = tab;
            document.querySelectorAll('.avatar-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderAvatarGrid();
        }

        function renderAvatarGrid() {
            const grid = document.getElementById('avatarGrid');
            const avatars = avatarTab === 'owned' ? ownedAvatars : allAvatars;
            
            if (avatars.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-secondary);">暂无头像</div>';
                return;
            }
            
            grid.innerHTML = avatars.map(avatar => {
                const isOwned = ownedAvatars.some(a => a.id === avatar.id);
                const isUsing = currentAvatarId === avatar.id;
                
                let btnHtml = '';
                if (isUsing) {
                    btnHtml = '<button class="avatar-btn using" disabled>使用中</button>';
                } else if (isOwned) {
                    btnHtml = `<button class="avatar-btn use" onclick="useAvatar(${avatar.id})">使用</button>`;
                } else {
                    btnHtml = `<button class="avatar-btn buy" onclick="buyAvatar(${avatar.id}, ${avatar.price})">购买 ${avatar.price}分</button>`;
                }
                
                const badge = isUsing ? '<div class="avatar-badge">⭐</div>' : '';
                
                return `
                    <div class="avatar-item">
                        ${badge}
                        <div class="avatar-img">
                            <img src="${avatar.image_url}" alt="${avatar.name}">
                        </div>
                        <div class="avatar-name">${avatar.name}</div>
                        ${btnHtml}
                    </div>
                `;
            }).join('');
        }

        async function buyAvatar(avatarId, price) {
            const points = parseInt(document.getElementById('kpiPoints').textContent);
            if (points < price) {
                alert(`积分不足！需要 ${price} 分，当前只有 ${points} 分`);
                return;
            }
            
            if (!confirm(`确定要购买这个头像吗？\n价格：${price} 积分`)) return;
            
            try {
                const res = await fetch(`${API_BASE}/avatars/${avatarId}/purchase`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await res.json();
                if (res.ok && data.success) {
                    alert('🎉 购买成功！');
                    document.getElementById('kpiPoints').textContent = data.new_balance;
                    loadAvatarGallery();
                } else {
                    alert(data.error || '购买失败');
                }
            } catch (e) {
                console.error(e);
                alert('购买失败，请稍后重试');
            }
        }

        async function useAvatar(avatarId) {
            try {
                const res = await fetch(`${API_BASE}/students/avatar`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ avatar_id: avatarId })
                });
                
                const data = await res.json();
                if (res.ok && data.success) {
                    alert('✅ 头像已更换！');
                    currentAvatarId = avatarId;
                    loadCurrentAvatar();
                    renderAvatarGrid();
                } else {
                    alert(data.error || '更换失败');
                }
            } catch (e) {
                console.error(e);
                alert('更换失败，请稍后重试');
            }
        }

        // 初始化加载
        loadDashboard();
    </script>
</body>
</html>
